services:
  watcher:
    image: my-haiku-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: watcher
    working_dir: /app
    volumes:
      - ./llm_pipeline/services/config.txt:/app/llm_pipeline/services/config.txt:ro
      - ./docling_models:/root/.cache/huggingface 
      - ./raw_docs:/raw_docs
      - ./docs_processed:/docs_processed
      - ./data:/data
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
    network_mode: host
    environment:
      PYTHONPATH: /app
      CONFIG: /app/haiku.rag.yaml
      DB_PATH: /data/haiku.rag.lancedb
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    depends_on:
      - docling-serve
    restart: unless-stopped

  haiku-monitor:
    image: my-haiku-app:latest
    working_dir: /app
    command: ["haiku-rag", "--config", "/app/haiku.rag.yaml", "serve", "--monitor", "--db", "/data/haiku.rag.lancedb"]
    volumes:
      - ./docs_processed:/docs_processed
      - ./data:/data
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
    network_mode: host
    environment:
      DOCLING_SERVE_URL: http://docling-serve:5001
      PYTHONPATH: /app
      CONFIG: /app/haiku.rag.yaml
      DB_PATH: /data/haiku.rag.lancedb
    depends_on:
      - docling-serve
      - watcher
    restart: unless-stopped

  orchestrator:
    image: my-orchestrator-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    working_dir: /app
    network_mode: host
    environment:
      PYTHONPATH: /app
      DB_PATH: /data/haiku.rag.lancedb
      CONFIG: /app/haiku.rag.yaml
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      HAIKU_EMBEDDING_MODEL: "nomic-embed-text:latest"
      HAIKU_EMBEDDING_VECTOR_DIM: "768"
    ports:
      - "8002:8002"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
      - ./llm_pipeline/prompts:/app/llm_pipeline/prompts
      - ./llm_pipeline/services/config.txt:/app/llm_pipeline/services/config.txt:ro

  docling-serve:
    image: ghcr.io/docling-project/docling-serve:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /data2/nkhajehn/docling_tmp:/tmp