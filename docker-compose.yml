services:
  watcher:
    image: my-haiku-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: watcher_build
    working_dir: /app
    volumes:
      - ./docling_models:/root/.cache/huggingface 
      - ./raw_docs:/raw_docs
      - ./docs_processed:/docs_processed
      - ./data:/data
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
    network_mode: host
    environment:
      PYTHONPATH: /app
      CONFIG: /app/haiku.rag.yaml
      DB: /data/haiku.rag.lancedb
      OLLAMA_URL: http://localhost:11434
    depends_on:
      - docling-serve
    restart: unless-stopped

  haiku-monitor:
    image: my-haiku-app:latest
    working_dir: /app
    command: ["haiku-rag", "--config", "/app/haiku.rag.yaml", "serve", "--monitor", "--db", "/data/haiku.rag.lancedb"]
    volumes:
      - ./docs_processed:/docs_processed
      - ./data:/data
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
    network_mode: host
    environment:
      PYTHONPATH: /app
      CONFIG: /app/haiku.rag.yaml
      OLLAMA_URL: http://localhost:11434
      DB: /data/haiku.rag.lancedb
    depends_on:
      - docling-serve
      - watcher
    restart: unless-stopped

  ollama-init:
    image: curlimages/curl:8.5.0
    network_mode: host
    volumes:
      - ./scripts/ollama_init.sh:/ollama_init.sh:ro
    entrypoint: ["/bin/sh","/ollama_init.sh"]
    environment:
      OLLAMA_URL: http://localhost:11434
    restart: "no"

  orchestrator:
    image: my-orchestrator-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator_build
    working_dir: /app
    network_mode: host
    environment:
      PYTHONPATH: /app
      DB_PATH: /data/haiku.rag.lancedb
      CONFIG: /app/haiku.rag.yaml
      OLLAMA_URL: http://localhost:11434
      HAIKU_EMBEDDING_MODEL: "nomic-embed-text:latest"
      HAIKU_EMBEDDING_VECTOR_DIM: "768"
    volumes:
      - ./data:/data
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
      - ./llm_pipeline/prompts:/app/llm_pipeline/prompts

  docling-serve:
    image: ghcr.io/docling-project/docling-serve:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /data2/nkhajehn/docling_tmp:/tmp